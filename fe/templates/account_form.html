{% extends "base.html" %}
{% block title %}{{ "Edit Account" if account else "Add Account" }}{% endblock %}

{% block content %}
<h2 class="mb-4">{{ "Edit Account" if account else "Add Account" }}</h2>

<div class="row">
  <div class="col-md-6">
    <form method="post"
          action="{{ url_for('edit_account', account_id=account.id) if account else url_for('add_account') }}">
      <div class="mb-3">
        <label for="name" class="form-label">Account Name <span class="text-danger">*</span></label>
        <input type="text" class="form-control" id="name" name="name"
               value="{{ account.name if account else '' }}"
               placeholder="e.g. Main Checking" required />
      </div>
      <div class="mb-3">
        <label for="type" class="form-label">Type <span class="text-danger">*</span></label>
        <select class="form-select" id="type" name="type" required>
          <option value="checking"   {% if account and account.type == 'checking' %}selected{% endif %}>Checking</option>
          <option value="savings"    {% if account and account.type == 'savings' %}selected{% endif %}>Savings</option>
          <option value="credit"     {% if account and account.type == 'credit' %}selected{% endif %}>Credit</option>
          <option value="investment" {% if account and account.type == 'investment' %}selected{% endif %}>Investment</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="balance" class="form-label">{{ "Balance" if account else "Opening Balance" }} ($)</label>
        <input type="number" class="form-control" id="balance" name="balance"
               step="0.01" min="0"
               value="{{ '%.2f'|format(account.balance|float) if account else '0.00' }}" />
      </div>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">
          {{ "Save Changes" if account else "Create Account" }}
        </button>
        <a href="{{ url_for('accounts') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
